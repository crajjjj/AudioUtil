# ConsoleUtil Extended (CUE) command config for the AudioUtil test harness.
# Requires: ConsoleUtil Extended  https://www.nexusmods.com/skyrimspecialedition/mods/133569
# Drops into Data\SKSE\CustomConsole\ ; maps console subcommands onto the
# global functions in AudioUtilTest.psc. A function's return prints to console
# (the T* harness uses Debug.Notification, so watch the top-left corner too).
#
# Usage in console:  AudioUtilTest T1     (or the alias)  autest T1
version: 1
name: AudioUtilTest
alias: autest
script: AudioUtilTest
help: AudioUtil console test harness (T1-T8, reload)
subs:
  - name: T1
    func: T1
    help: Basic loose-file play with default flags (0x1A / 128)
  - name: T2F
    func: T2F
    help: Play with explicit sound flags and priority (sweep these when silent/not 3D)
    args:
      - name: flags
        type: int
        default: 26        # 0x1A
        help: Sound flags (default 0x1A = 26)
      - name: priority
        type: int
        default: 128
        help: Sound priority (default 128)
  - name: T3
    func: T3
    help: PlayVoice via slot resolution on the player
  - name: T4
    func: T4
    help: Shuffle-bag check - plays a category 5x back to back (watch the log)
  - name: T5
    func: T5
    help: SFX table lookup / play
  - name: T6
    func: T6
    help: Channel replacement - second play should cut the first
  - name: T7
    func: T7
    help: Group duck / unduck
  - name: T8
    func: T8
    help: PPA connection status
  - name: TReload
    alias: reload
    func: TReload
    help: Reload AudioUtil.toml and rescan (via the test wrapper)

  # --- content-agnostic: pass what to play as args (work on any install) ---
  - name: play
    func: PlayPath
    help: Play any loose wav at the player by Data-relative path
    args:
      - name: path
        type: String
        required: true
        help: Data-relative wav path, e.g. Sound\fx\foo\bar.wav
  - name: playfolder
    func: PlayFolderPath
    help: Shuffle-bag play a whole folder as a pool (spoken/lipsynced); re-run for the next pick
    args:
      - name: folder
        type: String
        required: true
        help: Data-relative folder, e.g. Sound\TMSDynamicDialogue\VoiceBella\Base
  - name: playf
    func: PlayFlags
    help: DebugPlayFile any path with explicit flags/priority (RAW - a .fuz is not extracted)
    args:
      - name: path
        type: String
        required: true
        help: Data-relative path (wav/xwm/fuz)
      - name: flags
        type: int
        required: true
        help: sound_flags value, e.g. 26 (=0x1A default)
      - name: priority
        type: int
        default: 128
        help: sound priority (default 128)
  - name: sweep
    func: Sweep
    help: Auto-sweep 13 sound_flags values over one path (close the console after running; listen + watch notifications)
    args:
      - name: path
        type: String
        required: true
        help: Data-relative path (wav/xwm/fuz)
  - name: voice
    func: Voice
    help: Play a voice category from an explicit slot at the player
    args:
      - name: slot
        type: String
        required: true
        help: Slot id, e.g. M1
      - name: category
        type: String
        required: true
        help: Category name, e.g. Orgasm
  - name: voicepc
    func: VoicePC
    help: Resolve the player's slot and play a category through it
    args:
      - name: category
        type: String
        required: true
        help: Category name, e.g. Orgasm
  - name: sfx
    func: Sfx
    help: Play an SFX by name at the player
    args:
      - name: name
        type: String
        required: true
        help: SFX/category name, e.g. MediumClap
  - name: warmfolder
    func: WarmFolder
    help: Decode-only prewarm every .fuz in a folder into the cache, then RESTART the game (fixes MO2 first-play-silent)
    args:
      - name: folder
        type: String
        required: true
        help: Data-relative fuz folder, e.g. Sound\fx\SLOVE\Test
  - name: bbase
    func: BBase
    help: B-experiment step 1 - play cache wav [0] (A); note what it says
  - name: bswap
    func: BSwap
    help: B-experiment step 2 - overwrite A with cache wav [1] (B) and replay A; hear B=re-read(viable), A=cached
  - name: boverwrite
    func: BOverwrite
    help: B-experiment (explicit paths) - overwrite dst wav's bytes with src's; then 'play dst'
    args:
      - name: dst
        type: String
        required: true
        help: Data-relative wav to overwrite (must exist since launch, e.g. a prior-session cache wav)
      - name: src
        type: String
        required: true
        help: Data-relative wav whose bytes to write into dst
  - name: lipcap
    func: LipCap
    help: Record the dialogue speaker's 16 engine-driven MFG phoneme channels to CSV (lip-map calibration)
    args:
      - name: mode
        type: String
        required: true
        help: start | stop | status
  - name: lipfiles
    func: LipFiles
    help: Toggle .lip-driven phoneme lipsync (authored curves) vs the amplitude envelope; affects new lines
    args:
      - name: mode
        type: String
        required: true
        help: on | off | status
  - name: pseudolip
    func: PseudoLip
    help: Toggle pseudo-phoneme synthesis (vowel variety + lip closures) for lines without lip data; affects new lines
    args:
      - name: mode
        type: String
        required: true
        help: on | off | status
  - name: liplead
    func: LipLead
    help: Set the mouth timing lead in ms (positive = mouth earlier); applies live, all lipsync modes
    args:
      - name: arg
        type: String
        required: true
        help: milliseconds (-300..300) | status
