# ConsoleUtil Extended (CUE) command config for the generic TomlUtil reader.
# Requires: ConsoleUtil Extended  https://www.nexusmods.com/skyrimspecialedition/mods/133569
# Drops into Data\SKSE\CustomConsole\. Replaces the old (Skyrim-invalid)
# `cgf "TomlUtil.Reload" "SKSE\Plugins\MyMod\MyMod.toml"` example.
#
# Usage in console:  TomlUtil reload "SKSE\Plugins\MyMod\MyMod.toml"
#                    (alias)  toml reload "SKSE\Plugins\MyMod\MyMod.toml"
version: 1
name: TomlUtil
alias: toml
script: TomlUtil
help: Generic TOML reader console commands
subs:
  - name: Reload
    alias: reload
    func: Reload
    help: Re-parse one Data-relative TOML file; prints true on success, false (and keeps cached contents) on parse failure
    args:
      - name: file
        type: String
        required: true
        help: Data-relative path, e.g. SKSE\Plugins\MyMod\MyMod.toml

  # --- comment-preserving writers (TomlUtil API v2+); prints true when written ---
  - name: SetInt
    alias: setint
    func: ConsoleSetInt
    help: Write an int value to a TOML key, preserving comments/formatting
    args:
      - name: file
        type: String
        required: true
        help: Data-relative path, e.g. SKSE\Plugins\MyMod\MyMod.toml
      - name: key
        type: String
        required: true
        help: Dotted key, e.g. voice.pcvolume
      - name: value
        type: String
        required: true
        help: Integer value, e.g. 80
  - name: SetFloat
    alias: setfloat
    func: ConsoleSetFloat
    help: Write a float value to a TOML key, preserving comments/formatting
    args:
      - name: file
        type: String
        required: true
        help: Data-relative path
      - name: key
        type: String
        required: true
        help: Dotted key
      - name: value
        type: String
        required: true
        help: Float value, e.g. 1.5
  - name: SetString
    alias: setstring
    func: ConsoleSetString
    help: Write a string value to a TOML key, preserving comments/formatting
    args:
      - name: file
        type: String
        required: true
        help: Data-relative path
      - name: key
        type: String
        required: true
        help: Dotted key
      - name: value
        type: String
        required: true
        help: String value (quote if it contains spaces)
  - name: SetBool
    alias: setbool
    func: ConsoleSetBool
    help: Write a bool value to a TOML key, preserving comments/formatting
    args:
      - name: file
        type: String
        required: true
        help: Data-relative path
      - name: key
        type: String
        required: true
        help: Dotted key
      - name: value
        type: String
        required: true
        help: true/false or 1/0
