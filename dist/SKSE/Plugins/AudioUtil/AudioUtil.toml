# AudioUtil — default config.
# Native folder-based audio player: plays loose WAV files by folder path, no
# sound-descriptor forms or ESP. All key/name matching is case- and space-
# insensitive ("Battle Cry" == "BattleCry" == "battlecry").
#
# This file holds the GLOBAL settings only — [general], [ppa], [lipsync],
# [captions] and the [gag]/[tongue] toggles, which are read only from this base file. The voice slots,
# SFX, routing maps and gag/tongue markers are ADDITIVE content that accumulates from here
# plus every SKSE\Plugins\AudioUtil\config\*.toml overlay; ship those in an
# overlay, not here. A ready-to-copy overlay template lives in the sibling
# config.example\ folder (that folder is NOT loaded — copy it into config\).
#
# Full docs — merge rules, slot/category resolution, every key, the Papyrus API:
#   https://crajjjj.github.io/AudioUtil/

[general]
log_level = "info"            # trace | debug | info | warn | error
sound_flags = 0x1A            # BuildSoundDataFromFile flags (sweep via DebugPlayFile)
sound_priority = 128
voice_3d = true               # 3D-position voices at the speaker; false = flat/2D, all equally audible
voice_no_interrupt = false    # true = a still-playing channel skips the new line instead of cutting it
# Distance attenuation for follow-positioned sounds (voice + SFX). Loose-file playback
# has no rolloff curve, so voice_3d positions a sound but barely lowers its volume with
# distance - matters only when a sound plays far from the player. When on, volume is
# scaled by the listener->speaker distance: full within attenuation_near, then an
# inverse-distance rolloff (-6 dB per doubling, like the engine's own voice curves)
# down to attenuation_floor at attenuation_far (game units, ~70/m). Re-sampled every
# 250 ms while a line plays, so walking toward/away from a scene tracks.
# Off = unchanged (existing behavior).
voice_attenuation = true      # true = scale far follow-sounds down by distance
attenuation_near = 200.0      # full volume within this distance (~3 m)
attenuation_far = 1800.0      # volume reaches the floor at/beyond this distance (~26 m)
attenuation_floor = 0.05      # minimum volume factor for far sounds (0.0 = silent)
# .fuz playback decodes each fuz's audio once into Sound\AudioUtilFuzCache\
# (as PCM wav: reliable playback + lipsync). The cache persists across
# sessions; this caps its size in MB - checked once per launch, oldest files
# deleted first (~88 KB per second of audio, so 256 holds ~a thousand lines).
# 0 = unlimited. Deleting the folder by hand is always safe.
fuz_cache_max_mb = 256
# In-session fuz playback. Skyrim only loads loose files present at launch, so a fuz
# decoded on first play (its cache wav is written mid-session) would be silent until
# the next restart. AudioUtil sidesteps that by routing the audio through one of N
# pre-indexed placeholder wavs, so it plays immediately and is freed when the line
# ends. N = max fuz lines sounding at once (each takes a slot); 24 covers overlapping
# voices. 0 disables the pool (a first-session fuz then waits for a restart).
fuz_slots = 24
# Background decode-ahead: at game start, decode every .fuz in the configured slots
# to its cache wav on a worker thread. First play already works without this (see
# fuz_slots) - prewarm only removes the brief inline-decode hitch on a line's very
# first play by doing it ahead of time. Cheap once cached (a disk check per file).
# Leave off for wav-only voicepacks.
prewarm_fuz = false
# sfx_slot = "SFX0"           # [[slot]] PlaySFX resolves before the [sfx] table ("" = table only)
default_female_slot = ""      # slot for unrouted female actors ("" = none; an overlay sets it)
default_male_slot = ""         # slot for unrouted male actors and creatures ("" = none)
pc_female_slot = ""           # reserved player slot; no NPC ever resolves to it ("" = none)
pc_male_slot = ""

[ppa]
enable = false                # optional third-party PPA plugin bridge, off by default
event_rate_ms = 2000          # min interval per receiver for AudioUtilPPA_Update events (floored at 1000)

[lipsync]
enable = true                 # mouth movement for played voices (loose PCM wav; fuz via its decoded audio)
gain = 1.0                    # 0.0-2.0 mouth-open strength
attack_ms = 30                # how fast the mouth opens toward a louder level
release_ms = 90               # how fast it closes on quiet / clip end
min_level = 0.04              # envelope levels below this keep the mouth closed
block_in_dialogue = true      # don't lipsync an actor while they're in a dialogue with the player (the game drives that mouth)
use_lip_files = false          # EXPERIMENTAL. Real phoneme lipsync when a line has lip data (a same-stem
                              # .lip file, or a .fuz's embedded lip block): the authored per-phoneme curves
                              # drive the mouth instead of the amplitude envelope. Lines without lip data
                              # keep the envelope. Off by default - the envelope/pseudo-phoneme path is the
                              # tested one. Runtime A/B toggle: console `autest lipfiles on|off`
drive_modifiers = false       # let .lip data also drive blinks/brows/eye direction (the 16 MFG modifier
                              # channels a lip carries). Off by default - expression mods own those channels.
pseudo_phonemes = true       # lines WITHOUT lip data: synthesize phoneme curves from the amplitude
                              # envelope - per-syllable vowel variety (Aah\Oh\Ooh\Eh) plus brief lip
                              # closures after silence gaps - instead of the plain Aah jaw-flap.
                              # Deterministic per file (a given wav always mouths the same way).
                              # Runtime A\B toggle: console `autest pseudolip on|off`
lead_ms = 0                   # mouth timing lead in ms (-300..300), all lipsync modes. Leave at 0 unless
                              # the mouth visibly TRAILS the sound - then raise it to sample the mouth
                              # curves ahead of the playback clock. Calibrate live: `autest liplead 80`
# Pseudo-synthesis tuning (only used while pseudo_phonemes is on). Calibrate
# visually in tools\lipsim (drop a wav, drag the sliders, "copy constants"),
# paste the values here, `au reload` - affects newly started lines, no rebuild.
pseudo_voiced_floor = 0.05    # voiced when envelope >= max(min_level, this); raise to ignore breath noise
pseudo_valley_ratio = 0.6     # split syllables at dips below this fraction of the running peak
                              # (higher = choppier, more vowel changes; lower = long merged syllables)
pseudo_min_syl_frames = 3     # minimum syllable length in 30 fps frames (raise to kill flicker)
pseudo_gap_frames = 5         # silence frames that earn a BMP lip closure before the next syllable (5 = 165 ms)
pseudo_closure = 0.85         # closure strength 0-1 (how firmly the lips shut between moans)
# block_categories = ["Slurp"]   # categories that never drive the mouth (additive: overlays may add their own)

[gag]
# Gag / mouth-owning devices. When a speaking actor wears any gag marker below
# - a `keywords` keyword or a specific `items` armor form - two things happen
# automatically:
#   1. her voice routes through her slot's `gag_slot` so a muffled clip plays
#      instead of the clear line, and
#   2. lipsync is suppressed - the device owns the mouth, so the DLL won't
#      fight it.
# If the gag slot lacks the requested category, `default_category` plays there
# as a muffled catch-all - never silence, never a clear line.
# Both lists use 'Plugin.esp|FormID' (hex), same form as [npc_overrides] keys.
# A marker whose mod you don't run is silently skipped, so leaving all of
# these listed is harmless. enable = false turns the whole feature off.
# enable / default_category are globals -> base-only; the keywords and items
# lists are ADDITIVE, so an overlay may contribute more gag markers.
enable = true
default_category = "GagMoan"
# keywords: match any worn item carrying one of these keywords - covers a whole
# device family (every gag in a mod) with one entry. Prefer this when the mod
# tags its gags with a keyword.
keywords = [
  'Devious Devices - Assets.esm|7EB8',   # zad_DeviousGag
  'ZaZAnimationPack.esm|8A4D',           # zbfWornGag
  'ZaZAnimationPack.esm|8A35',           # zbfEffectOpenMouth
  'Toys.esm|8C2',                        # ToysEffectMouthOpen
]
# items: match these specific worn item forms (usually ARMO armor). Use for a
# one-off gag that carries no usable keyword - point straight at the item.
items = [
  # 'MyGagMod.esp|000800',   # a specific worn gag with no keyword to match
]

[tongue]
# Worn-tongue (or other item) lipsync suppression. When a speaking actor wears any tongue marker
# below - a `keywords` keyword or a specific `items` armor form - lipsync is
# suppressed for that line: a visible tongue needs the mouth held open, and the
# amplitude-driven jaw-flap would clip it (the same reason a gag suppresses lipsync).
# Detection only - unlike [gag] it does NOT reroute the voice, so there is no
# gag_slot / default_category analogue; the line still plays, just mouth-still.
# Both lists use 'Plugin.esp|FormID' (hex). A marker whose mod you don't run is
# silently skipped. enable = false turns the whole feature off.
# enable is a global -> base-only; keywords and items are ADDITIVE, so a content
# mod ships its tongue-armor forms in a config\*.toml overlay.
enable = true
# keywords: match any worn item carrying one of these keywords - covers a whole
# tongue family (e.g. SexLab Survival's tongue keyword) with one entry.
keywords = [
  # 'MyTongueMod.esp|000800',   # example: a tongue keyword
]
# items: match these specific worn tongue-armor forms. Use for tongue armors that
# carry no keyword (the usual case) - point straight at each armor.
items = [
  # 'MyTongueMod.esp|000800',   # a specific worn tongue armor
]

[captions]
# On-screen captions for played lines. When a wav has a same-named .toml
# sidecar next to it (moan_03.wav + moan_03.toml) holding per-language text:
#   en = "Does this count as extra follower duty?"
#   ru = "Это считается дополнительной службой?"
# the text is shown as a regular game subtitle attributed to the speaking
# actor while the line plays (and an AudioUtil_Caption mod event is sent for
# mods that draw their own UI). No sidecar = no caption, so this is safe to
# leave enabled; voice packs opt in per file by shipping sidecars.
# Sidecars are loose files only (not read out of BSAs). All keys base-only.
enable = true
# Which sidecar key to read. "auto" = follow the game's sLanguage ini setting
# ("ENGLISH" -> "en", "RUSSIAN" -> "ru", ...); or set an explicit key ("en").
# A missing localization falls back to the sidecar's "en" text.
language = "auto"
# false = never inject the HUD subtitle, only send the AudioUtil_Caption mod
# event - for a consumer mod that renders captions with its own widget.
hud = true

[groups]                      # startup volumes per group, 0.0-1.0 (a consumer mod overrides at runtime via SetGroupVolume)
pc_high = 1.0
pc_low = 1.0
partner_high = 1.0
partner_low = 1.0
sfx = 1.0
oneshot = 1.0

# ---------------------------------------------------------------------------
# Voice slots, SFX, [gag]/[tongue] keywords/items, and the voicetype/race/category routing
# tables are ADDITIVE content — define them in a config\*.toml overlay. See the annotated
# template in config.example\my_mod_slots.toml and the docs for the full
# reference and resolution rules: https://crajjjj.github.io/AudioUtil/
